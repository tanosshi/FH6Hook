name: Build and Release DLL

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch Detours
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/microsoft/Detours/archive/refs/tags/v4.0.1.zip"
          $zip = "$env:RUNNER_TEMP\detours.zip"
          $extract = "$env:RUNNER_TEMP\detours"

          Remove-Item -Recurse -Force Detours-src -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          Move-Item -Path "$extract\Detours-4.0.1" -Destination Detours-src

      - name: Build Detours
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\Detours-src\src"
          nmake clean
          nmake "CFLAGS=/W4 /WX /Zi /MD /Gy /Gm- /Zl /Od /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x501"

      - name: Build version.dll
        shell: cmd
        run: |
          msbuild version.sln /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="%GITHUB_WORKSPACE%\dist\\"

      - name: Keep only version.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = Get-ChildItem -Path dist -Recurse -Filter version.dll | Select-Object -First 1
          if (-not $dll) {
            throw "version.dll was not produced."
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path $dll.FullName -Destination release\version.dll -Force

      - name: Read commit message
        shell: pwsh
        run: |
          git log -1 --pretty=%B | Out-File -FilePath release_notes.txt -Encoding utf8

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: release/version.dll

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/version.dll" `
            --title "${{ github.ref_name }}" `
            --notes-file release_notes.txt
